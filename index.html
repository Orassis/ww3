<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World War 3</title>
  <link rel="stylesheet" href="style.css?v=4">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>World War 3</h1>
      <p class="subtitle">סימולציית ניהול מלחמה</p>
    </header>

    <div id="maps-container">
      <div class="map-panel" id="israel-panel">
        <div class="panel-header">
          <span class="flag">🇮🇱</span>
          <h2>ישראל</h2>
        </div>
        <div class="map-view" id="israel-map"></div>
      </div>

      <div class="map-panel" id="iran-panel">
        <div class="panel-header">
          <span class="flag">🇮🇷</span>
          <h2>איראן</h2>
        </div>
        <div class="map-view" id="iran-map"></div>
      </div>
    </div>

    <div id="action-bar">
      <button id="start-btn">התחל משחק</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
